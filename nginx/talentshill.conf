# nginx config for TalentsHill — HTTP only (before SSL)
# After running certbot, this file is replaced with HTTPS version automatically.
# Path: /etc/nginx/sites-available/talentshill.conf

server {
    listen 80;
    listen [::]:80;
    server_name talentshill.com www.talentshill.com;

    # Security headers
    add_header X-Content-Type-Options    nosniff      always;
    add_header X-Frame-Options           SAMEORIGIN   always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Static assets — served directly with long cache
    location /_next/static/ {
        alias /opt/talentshill/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /opt/talentshill/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /images/ {
        alias /opt/talentshill/public/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy all other requests to Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Rate limiting (defined in nginx.conf main block)
        # limit_req zone=app burst=20 nodelay;
    }

    # Block common attack paths
    location ~ /\. { deny all; }
    location ~* \.(env|git|svn|htaccess|htpasswd)$ { deny all; }
}
